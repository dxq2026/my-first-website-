<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>段显庆 | 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f0f4f8, #e6edf7);
            color: #2d3748;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
            transition: 0.3s ease;
        }
        .container:hover {
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
        }
        h1 {
            text-align: center;
            color: #2b6cb0;
            margin-bottom: 8px;
            font-size: 32px;
        }
        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 32px;
            font-size: 18px;
        }
        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: #2b6cb0;
            margin: 32px 0 16px;
            padding-left: 8px;
            border-left: 4px solid #2b6cb0;
        }
        .info-item {
            padding: 14px 0;
            border-bottom: 1px solid #e2e8f0;
            font-size: 17px;
        }
        .info-item strong {
            color: #2d3748;
            width: 110px;
            display: inline-block;
        }
        .tutor-card {
            background-color: #f7fafc;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        .tutor-card p {
            line-height: 1.8;
            margin-bottom: 10px;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #a0aec0;
            font-size: 14px;
        }
        /* 手机适配 */
        @media (max-width: 600px) {
            .container {
                padding: 24px;
            }
            h1 {
                font-size: 26px;
            }
            .info-item strong {
                width: auto;
                display: block;
                margin-bottom: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>段显庆</h1>
        <div class="subtitle">浙江师范大学 · 大一</div>

        <div class="section-title">📌 个人信息</div>
        <div class="info-item">
            <strong>🎓 专业</strong>
            交通运输（数字交通方向）
        </div>
        <div class="info-item">
            <strong>📍 校区</strong>
            杭州校区
        </div>
        <div class="info-item">
            <strong>📖 简介</strong>
            性格耐心，擅长沟通，对待教学认真负责。
        </div>

        <div class="section-title">📚 家教接单</div>
        <div class="tutor-card">
            <p>✅ <strong>授课对象：</strong>小学阶段学生</p>
            <p>✅ <strong>上课时间：</strong>周末授课</p>
            <p>✅ <strong>薪资期望：</strong>70 元 / 小时，最低可接受 60 元 / 小时</p>
            <p>✅ <strong>教学特色：</strong>善于引导孩子理解知识点，培养良好学习习惯，耐心答疑。</p>
        </div>

        <div class="footer">
            © 2026 段显庆 Personal Website
        </div>
    </div>
</body>
</html>
